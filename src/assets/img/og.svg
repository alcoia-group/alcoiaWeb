<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>alcoia</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,300;0,400;0,700;1,400&display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F9F7F2"/>

  <!-- Decorative rule -->
  <rect x="120" y="100" width="64" height="3" fill="#7E60AE"/>

  <!-- Wordmark with lilac accent block -->
  <g>
    <!-- Lilac accent block behind "oia" -->
    <rect x="520" y="200" width="280" height="160" fill="#7E60AE"/>

    <!-- "alc" in ink -->
    <text x="120" y="330" font-family="Literata, Georgia, serif" font-size="140" font-weight="400" fill="#333333">alc</text>

    <!-- "oia" in paper (over lilac block) -->
    <text x="520" y="330" font-family="Literata, Georgia, serif" font-size="140" font-weight="400" fill="#F9F7F2">oia</text>
  </g>

  <!-- IPA pronunciation -->
  <text x="120" y="420" font-family="Literata, Georgia, serif" font-size="24" font-weight="300" fill="#6B6862">/ælˈkɔɪ.ə/ · al-KOY-uh</text>

  <!-- New tagline -->
  <text x="120" y="500" font-family="Literata, Georgia, serif" font-size="36" font-weight="400" fill="#333333">Retrieval practice, not summaries.</text>
</svg>
